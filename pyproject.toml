[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reflex-jev"
version = "0.1.0"
description = "Batching, caching and confidence-gated control flow for TypeSafe AI's Jev System One model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["typesafe-sdk>=0.7.1"]

[project.urls]
Homepage = "https://github.com/NenXMaster-AB/reflex"
Repository = "https://github.com/NenXMaster-AB/reflex"
Issues = "https://github.com/NenXMaster-AB/reflex/issues"
Changelog = "https://github.com/NenXMaster-AB/reflex/commits/main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/reflex_jev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
